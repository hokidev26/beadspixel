<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼豆圖紙製作｜上傳圖片轉拼豆圖案・線上編輯｜拼豆圖紙產生器</title>
  <meta name="description" content="上傳圖片，一鍵轉成拼豆圖紙。可用畫筆、填色、橡皮擦手動修改，選擇 MARD、Hama、Artkal、Perler 等 9 大品牌色號，下載 PNG／PDF 圖紙與色號用量清單。">
  <link rel="canonical" href="https://beads.dingdongxi.com/editor">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page-title="pageTitleEditor">
  <header>
    <div class="header-brand">
      <a href="index.html" class="header-home">
        <canvas class="logo-canvas" width="34" height="34" aria-hidden="true"></canvas>
        <h1 data-i18n="editorTitle">拼豆圖紙產生器</h1>
      </a>
    </div>
    <p class="subtitle" data-i18n="editorSubtitle">上傳圖片，一鍵轉換成拼豆圖紙</p>
    <div class="lang-mount" data-lang-mount></div>
  </header>

  <main>
    <section class="controls" data-i18n-aria-label="ariaPatternSettings">
      <div class="upload-column">
      <div class="upload-area" id="uploadArea" role="button" tabindex="0" aria-controls="fileInput" aria-describedby="uploadHint uploadStatus uploadError" data-i18n-aria-label="ariaUpload">
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
        <div class="upload-placeholder" id="uploadPlaceholder">
          <span class="upload-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg></span>
          <p data-i18n="uploadText">點擊或拖曳圖片到這裡</p>
          <p class="hint" id="uploadHint" data-i18n="uploadHint">支援 JPG、PNG、GIF、WebP，最大 15 MB</p>
        </div>
        <img id="previewImg" class="preview-img" alt="" hidden>
        <div class="upload-loading" id="uploadLoading" hidden><span class="loading-spinner" aria-hidden="true"></span><span data-i18n="uploadLoading">正在讀取圖片…</span></div>
      </div>
      <div id="uploadStatus" class="status-message" role="status" aria-live="polite"></div>
      <div id="uploadError" class="status-message error-message" role="alert" aria-live="assertive" hidden></div>
      </div>

      <div class="settings">
        <div class="setting-group">
          <label for="boardSize" data-i18n="boardSize">拼豆板尺寸</label>
          <select id="boardSize">
            <option value="20">20×20</option>
            <option value="30">30×30</option>
            <option value="40">40×40</option>
            <option value="50" selected>50×50</option>
            <option value="60">60×60</option>
            <option value="custom" data-i18n="boardCustom">自訂</option>
          </select>
        </div>
        <div class="setting-group custom-size" id="customSizeGroup" hidden>
          <div class="custom-size-fields">
            <div><label for="customWidth" data-i18n="customW">寬度（珠數）</label><input type="number" id="customWidth" min="10" max="200" value="50" inputmode="numeric"></div>
            <div><label for="customHeight" data-i18n="customH">高度（珠數）</label><input type="number" id="customHeight" min="10" max="200" value="50" inputmode="numeric"></div>
          </div>
          <p class="hint" data-i18n="sizeLimitHint">每邊 10–200，總格數最多 40,000</p>
        </div>
        <div class="setting-group">
          <label for="colorCount"><span data-i18n="colorCount">顏色數量</span>: <span id="colorCountVal">15</span></label>
          <input type="range" id="colorCount" min="2" max="60" value="15">
        </div>
        <div class="setting-group">
          <label for="brand" data-i18n="brandLabel">拼豆品牌</label>
          <select id="brand">
            <option value="mard">MARD (188)</option><option value="hama">Hama (51)</option><option value="artkal-s">Artkal S (185)</option><option value="artkal-r">Artkal R (93)</option><option value="artkal-c">Artkal C (157)</option><option value="artkal-a">Artkal A (157)</option><option value="perler">Perler (89)</option><option value="perler-mini">Perler Mini (42)</option><option value="nabbi">Nabbi (30)</option>
          </select>
        </div>
        <div class="setting-group">
          <label for="imageFit" data-i18n="fitMode">圖片適配</label>
          <select id="imageFit"><option value="fit" data-i18n="fitContain">完整顯示（留白）</option><option value="fill" data-i18n="fitCover">填滿並裁切</option><option value="stretch" data-i18n="fitStretch">拉伸填滿</option></select>
        </div>
        <div class="setting-group">
          <label for="backgroundColor" data-i18n="backgroundColor">背景色（透明像素）</label>
          <input type="color" id="backgroundColor" value="#FFFFFF">
        </div>
        <div class="setting-group">
          <label for="beadShape" data-i18n="shapeLabel">珠子形狀</label>
          <select id="beadShape"><option value="circle" data-i18n="shapeCircle">圓形</option><option value="square" data-i18n="shapeSquare">方形</option></select>
        </div>
        <div class="setting-group"><label><input type="checkbox" id="showGrid" checked> <span data-i18n="showGrid">顯示格線</span></label></div>
        <details class="advanced-toggle" open>
          <summary data-i18n="advancedOpts">進階選項</summary>
          <div class="setting-group"><label><input type="checkbox" id="showSymbols"> <span data-i18n="showSymbols">顯示符號（方便辨識顏色）</span></label></div>
          <div class="setting-group"><label for="highlightLines"><span data-i18n="highlightLines">加粗線間隔</span>: <span id="highlightVal">10</span></label><input type="range" id="highlightLines" min="0" max="29" value="10"><p class="hint" data-i18n="highlightHint">每隔 N 行加粗格線，方便數格子（0 = 關閉）</p></div>
        </details>
        <button id="convertBtn" class="btn-primary" disabled data-i18n="convertBtn">轉換圖紙 →</button>
      </div>
    </section>

    <!-- Icons: Lucide (ISC license), https://lucide.dev -->
    <section class="result" id="resultSection" hidden aria-labelledby="resultTitle">
      <div class="workspace-head">
        <h2 id="resultTitle" data-i18n="resultTitle">拼豆圖紙</h2>
        <div id="resultStatus" class="status-message" role="status" aria-live="polite"></div>
        <button type="button" id="reconvertBtn" class="btn-small btn-reconvert" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg><span data-i18n="reconvertBtn">套用新設定</span></button>
        <div class="tool-group toolbar-end">
          <button type="button" id="downloadPng" class="btn-small"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="downloadPng">PNG</span></button>
          <button type="button" id="downloadPdf" class="btn-small btn-small-accent"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="downloadPdf">PDF</span></button>
        </div>
        <button type="button" id="settingsJump" class="btn-small settings-jump"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg><span data-i18n="settingsJump">調整設定</span></button>
      </div>
      <div class="edit-toolbar" id="editToolbar" role="toolbar" data-i18n-aria-label="ariaEditTools">
        <div class="tool-group" role="radiogroup" data-i18n-aria-label="ariaEditTools">
          <button type="button" class="tool-btn is-active" data-tool="view" data-shortcut="V" role="radio" aria-checked="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><span class="tool-label" data-i18n="toolView">瀏覽</span></button>
          <button type="button" class="tool-btn" data-tool="pen" data-shortcut="B" role="radio" aria-checked="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg><span class="tool-label" data-i18n="toolPen">畫筆</span></button>
          <button type="button" class="tool-btn" data-tool="fill" data-shortcut="G" role="radio" aria-checked="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg><span class="tool-label" data-i18n="toolFill">填色</span></button>
          <button type="button" class="tool-btn" data-tool="picker" data-shortcut="I" role="radio" aria-checked="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg><span class="tool-label" data-i18n="toolPicker">滴管</span></button>
          <button type="button" class="tool-btn" data-tool="eraser" data-shortcut="E" role="radio" aria-checked="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span class="tool-label" data-i18n="toolEraser">橡皮擦</span></button>
        </div>
        <label class="paint-color" for="paintColor">
          <span class="paint-swatch" id="paintSwatch" aria-hidden="true"></span>
          <span class="visually-hidden" data-i18n="paintColorLabel">目前顏色</span>
          <select id="paintColor"></select>
        </label>
        <div class="tool-group">
          <button type="button" id="undoBtn" class="btn-small" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg><span data-i18n="undo">復原</span></button>
          <button type="button" id="redoBtn" class="btn-small" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg><span data-i18n="redo">重做</span></button>
        </div>
      </div>
      <div class="canvas-stage" id="canvasStage" data-tool="view">
        <canvas id="beadCanvas" tabindex="0" data-i18n-aria-label="ariaPattern"></canvas>
        <div class="stage-info" id="stageInfo" aria-hidden="true"></div>
        <canvas id="minimap" class="minimap" hidden aria-hidden="true"></canvas>
        <div class="zoom-controls" role="group" data-i18n-aria-label="ariaZoomControls">
          <button type="button" id="zoomOut" class="zoom-btn" data-i18n-aria-label="zoomOutLabel" data-i18n-title="zoomOutLabel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <span class="zoom-level" id="zoomLevel" aria-live="off">100%</span>
          <button type="button" id="zoomIn" class="zoom-btn" data-i18n-aria-label="zoomInLabel" data-i18n-title="zoomInLabel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
          <button type="button" id="zoomFit" class="zoom-btn zoom-text" data-i18n-title="zoomFitTitle"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg><span data-i18n="zoomFit">全覽</span></button>
          <button type="button" id="focusBtn" class="zoom-btn" aria-pressed="false" data-i18n-aria-label="focusMode" data-i18n-title="focusMode"><svg class="icon icon-focus-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg><svg class="icon icon-focus-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg></button>
        </div>
      </div>
      <aside class="workspace-side">
        <div class="bead-count" id="beadCount" aria-live="polite"></div>
        <div class="color-legend" id="colorLegend"><h3 data-i18n="colorList">顏色清單</h3><div id="legendItems"></div></div>
        <!-- Shop link hidden until the store opens: remove `hidden` to bring it back. -->
        <div class="buy-section" id="buySection" hidden><a id="buyLink" href="https://dingdongxi.com" target="_blank" rel="noopener" class="btn-buy"><span data-i18n="buyBtn">購買材料</span></a><p class="buy-hint" data-i18n="buyHint">根據色號清單，一鍵前往商城選購所需珠子</p></div>
      </aside>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
